services:
  sentinelbridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinelbridge-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - API_KEY=sb-live-token-production-secret
      - API_KEY_HEADER=X-Sentinel-Key
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true